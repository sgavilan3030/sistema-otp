<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background circle for high contrast in browser tab -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#334155" stroke-width="2"/>

  <!-- Black Hat Crown -->
  <!-- Crease and top indentation typical of a fedora / black hat -->
  <path d="M 22 28 C 22 22, 26 15, 32 17 C 38 15, 42 22, 42 28 L 44 38 L 20 38 Z"
        fill="url(#crownGrad)" stroke="#475569" stroke-width="1.2" stroke-linejoin="round"/>
  
  <!-- Crown Top Crease / Dimple -->
  <path d="M 27 21 C 30 23, 34 23, 37 21" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cyber / Secret Agent Band -->
  <path d="M 19.5 35.5 C 26 37.5, 38 37.5, 44.5 35.5 L 45 38.5 C 38 40.5, 26 40.5, 19 38.5 Z"
        fill="url(#bandGrad)" opacity="0.95"/>

  <!-- Hat Brim with curved 3D hacker styling -->
  <path d="M 8 41 C 12 37, 24 38, 32 38 C 40 38, 52 37, 56 41 C 58 43, 54 46, 44 47 C 34 48, 22 47, 12 45 C 7 43.5, 6 42, 8 41 Z"
        fill="#090d16" stroke="#06b6d4" stroke-width="1.2" stroke-linejoin="round"/>
  
  <!-- Brim highlight edge -->
  <path d="M 10 41.5 C 18 39, 32 39.5, 46 41 C 53 41.8, 55 43, 53 43.8 C 45 46.2, 27 46.5, 14 44.5"
        stroke="#38bdf8" stroke-width="0.75" stroke-linecap="round" opacity="0.8"/>
</svg>
